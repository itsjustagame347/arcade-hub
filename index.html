
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Hub 🎮</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a16;color:#f5f6ff;font-family:Arial,sans-serif}
header{text-align:center;padding:32px 15px;background:#10162b;border-bottom:2px solid #00f5ff}
h1{margin:0;color:#00f5ff;font-size:clamp(32px,6vw,50px);text-shadow:0 0 18px #00f5ff88}
header p{color:#b9c6e6}
main{max-width:1200px;margin:auto;padding:24px 16px}
#search{width:100%;padding:15px;border-radius:12px;border:1px solid #00f5ff;background:#10162b;color:white;font-size:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 24px}
button{padding:10px 15px;border:1px solid #00f5ff;border-radius:10px;background:#11182d;color:white;cursor:pointer}
button:hover,button.active{background:#00d9e8;color:#07101d}
#count{color:#aab8d8;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{background:#10162a;border:1px solid #283755;border-radius:16px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);border-color:#00f5ff;box-shadow:0 0 18px #00f5ff33}
.art{height:105px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#24235b,#12606c)}
.info{padding:15px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0 0 8px}
.info p{font-size:13px;line-height:1.5;color:#b9c6e6;flex:1}
.play{display:block;text-align:center;text-decoration:none;background:linear-gradient(90deg,#00f5ff,#a855f7);color:#080b16;padding:11px;border-radius:9px;font-weight:bold}
.empty{padding:25px;text-align:center;color:#b9c6e6}
footer{text-align:center;color:#8794b5;padding:30px}
</style>
</head>

<h1>🎮 ARCADE HUB</h1>
<p>Find a game. Click play. Have fun!</p>
</header>

<input id="search" type="search" placeholder="🔎 Search games..." aria-label="Search games">
<div class="filters">

<button data-cat="Puzzle">🧩 Puzzle</button>
<button data-cat="Classic">⭐ Classic</button>
<button data-cat="Strategy">♟️ Strategy</button>
</div>
<div id="count"></div>
<div id="games" class="grid"></div>
</main>
<footer>ARCADE HUB · More games, more fun 🎮</footer>

const list = document.getElementById("games");
const search = document.getElementById("search");
const count = document.getElementById("count");
let category = "All";

function render(){
  const q = search.value.toLowerCase().trim();
  const shown = games.filter(g =>
    (category === "All" || g[1] === category) &&
    (g[0] + " " + g[1]).toLowerCase().includes(q)
  );
  count.textContent = shown.length + " games";
  list.innerHTML = "";
  if(!shown.length){
    list.innerHTML = '<div class="empty">No games found. Try another search!</div>';
    return;
  }
  shown.forEach(g => {
    const card = document.createElement("article");
    card.className = "card";
    const art = document.createElement("div");
    art.className = "art";
    art.textContent = g[2];
    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("h3");
    title.textContent = g[0];
    const desc = document.createElement("p");
    desc.textContent = "Category: " + g[1] + ". Click below to play or visit the game site.";
    const link = document.createElement("a");
    link.className = "play";
    link.href = g[3];
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Play Game ↗";
    info.append(title, desc, link);
    card.append(art, info);
    list.append(card);
  });
}

search.addEventListener("input", render);
document.querySelectorAll("[data-cat]").forEach(button => {
  button.addEventListener("click", () => {
    category = button.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    render();
  });
});
render();
</script>
